server:
  port: 9001

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/messages}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false

app:
  jwt:
    secret: ${JWT_SECRET:hw7-part2-local-development-secret-change-me}
    issuer: ${JWT_ISSUER:user-management-service}
  users-service:
    base-url: ${USERS_SERVICE_URL:http://localhost:9000}
    timeout: ${USERS_SERVICE_TIMEOUT:3s}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
